kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
  labels:
    app.kubernetes.io/name: infra
    helm.sh/chart: infra-0.0.2
    app.kubernetes.io/instance: infra
    app.kubernetes.io/managed-by: Helm
spec:
  interval: 1m
  releaseName: kube-prometheus-stack
  timeout: 15m
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 92.11.0
      sourceRef:
        kind: HelmRepository
        name: prometheus
        namespace: infra
  values:
    alertmanager:
      enabled: false
    grafana:
      adminPassword: demo-grafana-pass-123
      grafana.ini:
        auth.ldap:
          enabled: false
        plugins:
          allow_loading_unsigned_plugins: true
        rendering:
          callback_url: http://localhost:3000/
        server:
          root_url: http://localhost:3000/
        users:
          viewers_can_edit: true
      ingress:
        enabled: false
      itfpv:
        nodeName: waga-demo
        pathPrefix: /mnt/itfLocalProvisionerData/kube-prometheus-stack-grafana
      persistence:
        enabled: true
        existingClaim: kube-prometheus-stack-grafana
      sidecar:
        dashboards:
          enabled: true
          searchNamespace: ALL
        datasources:
          enabled: true
          searchNamespace: ALL
        notifiers:
          enabled: true
          searchNamespace: ALL
    helmReleaseNamespace: monitoring
    kubeControllerManager:
      service:
        port: 10257
        targetPort: 10257
      serviceMonitor:
        https: true
    kubeEtcd:
      service:
        port: 2381
        targetPort: 2381
    kubeScheduler:
      service:
        port: 10259
        targetPort: 10259
      serviceMonitor:
        https: true
    prometheus:
      ingress:
        enabled: false
      itfpv:
        nodeName: waga-demo
        pathPrefix: /mnt/itfLocalProvisionerData/kube-prometheus-stack-prometheus
      prometheusSpec:
        evaluationInterval: 30s
        podMetadata:
          labels:
            app: prometheus
        podMonitorNamespaceSelector:
          matchExpressions:
          - key: inexisting-label2211
            operator: DoesNotExist
        podMonitorSelectorNilUsesHelmValues: false
        routePrefix: /prometheus/
        ruleNamespaceSelector:
          matchExpressions:
          - key: inexisting-label2211
            operator: DoesNotExist
        ruleSelectorNilUsesHelmValues: false
        scrapeInterval: 30s
        serviceDiscoveryRole: EndpointSlice
        serviceMonitorNamespaceSelector:
          matchExpressions:
          - key: inexisting-label2211
            operator: DoesNotExist
        serviceMonitorSelectorNilUsesHelmValues: false
        storageSpec:
          volumeClaimTemplate:
            spec:
              accessModes:
              - ReadWriteOnce
              resources:
                requests:
                  storage: 5Gi
              storageClassName: local-path
              volumeName: kube-prometheus-stack-prometheus

---
