    grafana_datasource: "1"
data:
  datasource.yaml: |-
    apiVersion: 1
    datasources:
    - name: Loki
      type: loki
      url: http://loki-v3:3100
      access: proxy
      isDefault: false
      jsonData:
        httpHeaderName1: 'Connection'
        httpHeaderName2: 'Upgrade'
      secureJsonData:
        httpHeaderValue1: 'Upgrade'
        httpHeaderValue2: 'websocket'
      editable: true

