apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: grafana
  namespace: infra
spec:
  interval: 10m
  url:  https://grafana.github.io/helm-charts



---
# Source: infra/templates/helmrepo/prometheus-helmrepo.yaml
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: prometheus
  namespace: infra
spec:
  interval: 10m
  url:  https://prometheus-community.github.io/helm-charts
