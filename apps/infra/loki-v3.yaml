apiVersion: v1
kind: PersistentVolume
metadata:
  name: loki-v3
spec:
  storageClassName: "local-path"
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    type: "DirectoryOrCreate"
    path: /mnt/itfLocalProvisionerData/loki-v3
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - waga-demo
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: storage-loki-v3-0
  namespace: monitoring
spec:
  accessModes:
    - ReadWriteOnce
  volumeName: "loki-v3"
  resources:
    requests:
      storage: 5Gi
  storageClassName: "local-path"
  volumeMode: Filesystem
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: grafana-community
  namespace: infra
spec:
  interval: 10m
  url: https://grafana-community.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki-v3
  namespace: monitoring
spec:
  interval: 1m
  releaseName: loki-v3
  timeout: 10m
  chart:
    spec:
      chart: loki
      version: 19.0.3
      sourceRef:
        kind: HelmRepository
        name: grafana-community
        namespace: infra
  values:
    loki:
      auth_enabled: false
      commonConfig:
        replication_factor: 1
      storage:
        type: filesystem
      schemaConfig:
        configs:
          - from: "2024-04-01"
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: loki_index_
              period: 24h
      limits_config:
        retention_period: 168h
        reject_old_samples: true
        reject_old_samples_max_age: 168h
        max_entries_limit_per_query: 20000
      compactor:
        retention_enabled: true
        delete_request_store: filesystem
    singleBinary:
      replicas: 1
      persistence:
        enabled: true
        size: 5Gi
        storageClass: local-path
    read:
      replicas: 0
    write:
      replicas: 0
    backend:
      replicas: 0
    gateway:
      enabled: false
    chunksCache:
      enabled: false
    resultsCache:
      enabled: false
    lokiCanary:
      enabled: false
    test:
      enabled: false
    minio:
      enabled: false
    monitoring:
      serviceMonitor:
        enabled: true
    sidecar:
      rules:
        enabled: false
