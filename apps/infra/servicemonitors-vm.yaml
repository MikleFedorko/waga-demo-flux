# ServiceMonitors for services running on "VMs" (selector-less Service + manual EndpointSlice).
# Needs prometheusSpec.serviceDiscoveryRole: EndpointSlice in kube-prometheus-stack values.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: minio-vm
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames:
      - develop
  selector:
    matchLabels:
      app.kubernetes.io/name: minio
  endpoints:
    - port: minio-api
      path: /minio/v2/metrics/cluster
      interval: 30s
      scrapeTimeout: 15s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: rabbitmq-vm
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames:
      - develop
  selector:
    matchLabels:
      app.kubernetes.io/name: rabbitmq
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 15s