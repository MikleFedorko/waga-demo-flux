apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: platforms-adapter
  namespace: develop
spec:
  interval: 10m
  timeout: 10m
  releaseName: platforms-adapter
  chart:
    spec:
      chart: application
      version: "9.3.2"
      sourceRef:
        kind: HelmRepository
        name: stakater
        namespace: infra
  values:
    applicationName: platforms-adapter
    # Was a sidecar container in the pulse-backend pod: no ports, env, probes or volumes.
    # TODO(Q8): check what it connects to. As a sidecar it could reach the backend on
    # localhost; as a separate Deployment it needs a Service address instead.
    deployment:
      replicas: 1
      image:
        repository: ghcr.io/stefanprodan/podinfo
        tag: "6.16.0"
        pullPolicy: IfNotPresent
      imagePullSecrets:
        - name: gitlab-registry
      # Parity with the old charts: no container securityContext was set.
      # TODO(hardening): try runAsNonRoot/readOnlyRootFilesystem=true on the demo first.
      containerSecurityContext:
        runAsNonRoot: false
        readOnlyRootFilesystem: false
    service:
      enabled: false
