apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pulse-frontend
  namespace: develop
spec:
  interval: 10m
  timeout: 10m
  releaseName: pulse-frontend
  chart:
    spec:
      chart: application
      version: "9.3.2"
      sourceRef:
        kind: HelmRepository
        name: stakater
        namespace: infra
  values:
    applicationName: pulse-frontend
    deployment:
      replicas: 1
      image:
        repository: ghcr.io/stefanprodan/podinfo
        tag: "6.16.0" # {"$imagepolicy": "flux-system:waga-pulse-frontend-qa:tag"}
        pullPolicy: IfNotPresent
      command:
        - ./podinfo
      args:
        - --port=8080
      imagePullSecrets:
        - name: gitlab-registry
      ports:
        - name: http
          containerPort: 8080
          protocol: TCP
      volumes:
        config:
          configMap:
            name: pulse-frontend-config
      volumeMounts:
        config:
          mountPath: /etc/nginx/conf.d
      livenessProbe:
        enabled: true
        initialDelaySeconds: 5
        periodSeconds: 3
        timeoutSeconds: 5
        failureThreshold: 3
        successThreshold: 1
        httpGet:
          path: /healthz
          port: http
          scheme: HTTP
      readinessProbe:
        enabled: true
        initialDelaySeconds: 5
        periodSeconds: 3
        timeoutSeconds: 5
        failureThreshold: 3
        successThreshold: 1
        httpGet:
          path: /healthz
          port: http
          scheme: HTTP
      # Parity with the old charts: no container securityContext was set.
      # TODO(hardening): try runAsNonRoot/readOnlyRootFilesystem=true on the demo first.
      containerSecurityContext:
        runAsNonRoot: false
        readOnlyRootFilesystem: false
    # Creates ConfigMap pulse-frontend-config with key app.conf (name = <applicationName>-<files key>).
    configMap:
      enabled: true
      files:
        config:
          app.conf: |
            client_max_body_size 100m;

            upstream backend {
                server pulse-backend:5000;
            }

            upstream frontend {
                server pulse-backend:5100;
            }

            server {
                listen 80;
                server_tokens off;

                gzip on;
                gzip_disable "msie6";
                gzip_types text/plain text/css application/json application/x-javascript text/xml application/xml application/xml+rss text/javascript application/javascript;

                set $app  /usr/share/nginx/html;

            #    auth_basic "Private Property";
            #    auth_basic_user_file $app/.htpasswd;

                location ~* ^/(css|fonts|images|scripts|favicons)/(.*) {
                    alias $app/$1/$2;
                }

                location / {
                 root /usr/share/nginx/html/;
                }

                location ~* ^/(api|photos|system) {
                    proxy_set_header Host $http_host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                    proxy_pass http://backend;
                }
            }
    service:
      enabled: true
      type: ClusterIP
      ports:
        - name: http
          port: 80
          targetPort: http
          protocol: TCP
    ingress:
      enabled: true
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-production
        kubernetes.io/ingress.class: nginx
        nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
        nginx.ingress.kubernetes.io/cors-allow-headers: Authorization, Content-Type
        nginx.ingress.kubernetes.io/cors-allow-methods: PUT, GET, POST, OPTIONS, DELETE, PATCH
        nginx.ingress.kubernetes.io/cors-allow-origin: http://localhost:3000, https://*.demo.local
        nginx.ingress.kubernetes.io/enable-cors: "true"
        nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
        nginx.ingress.kubernetes.io/proxy-buffer-size: 64k
        nginx.ingress.kubernetes.io/proxy-buffers: 8 64k
      hosts:
        - host: pulse-frontend.demo.local
          paths:
            - path: /
              pathType: ImplementationSpecific
              servicePort: http
      tls:
        - secretName: pulse-frontend.demo.local-tls
          hosts:
            - pulse-frontend.demo.local
