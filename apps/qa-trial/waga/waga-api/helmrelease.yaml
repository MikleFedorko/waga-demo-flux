apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: waga-api
  namespace: develop
spec:
  interval: 10m
  timeout: 10m
  releaseName: waga-api
  chart:
    spec:
      chart: application
      version: "9.3.2"
      sourceRef:
        kind: HelmRepository
        name: stakater
        namespace: infra
  values:
    applicationName: waga-api
    deployment:
      replicas: 1
      image:
        repository: ghcr.io/stefanprodan/podinfo
        tag: "6.16.0" # {"$imagepolicy": "flux-system:waga-api-qa:tag"}
        pullPolicy: IfNotPresent
      command:
        - ./podinfo
      args:
        - --port=9901
      imagePullSecrets:
        - name: gitlab-registry
      ports:
        - name: http
          containerPort: 9901
          protocol: TCP
      env:
        WAGA_IO_URL:
          value: "http://waga-io:9900/api"
        MINIO_BUCKET:
          value: "media"
        MINIO_URL:
          value: "http://minio:9000"
        MQ_HOST:
          value: "rabbitmq"
      # MINIO_ACCESS_KEY, MINIO_SECRET_KEY, MQ_USER, MQ_PASSWORD come from this Secret (SOPS).
      envFrom:
        waga-api-env:
          type: secret
          name: waga-api-env
      livenessProbe:
        enabled: true
        initialDelaySeconds: 5
        periodSeconds: 2
        timeoutSeconds: 2
        failureThreshold: 3
        successThreshold: 1
        tcpSocket:
          port: 9901
      readinessProbe:
        enabled: true
        initialDelaySeconds: 5
        periodSeconds: 2
        timeoutSeconds: 2
        failureThreshold: 3
        successThreshold: 2
        tcpSocket:
          port: 9901
      # Parity with the old charts: no container securityContext was set.
      # TODO(hardening): try runAsNonRoot/readOnlyRootFilesystem=true on the demo first.
      containerSecurityContext:
        runAsNonRoot: false
        readOnlyRootFilesystem: false
      # The old affinity (anti-affinity to name=waga-io) matched no pods because the
      # old io pods were labelled name=io, so it never had an effect. Not carried over.
    service:
      enabled: true
      type: ClusterIP
      ports:
        - name: http
          port: 9901
          targetPort: http
          protocol: TCP
    ingress:
      enabled: true
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-production
        kubernetes.io/ingress.class: nginx
        kubernetes.io/tls-acme: "true"
        nginx.ingress.kubernetes.io/configuration-snippet: |
          add_header X-Frame-Options "SAMEORIGIN";
          add_header X-Content-Type-Options nosniff;
          add_header X-XSS-Protection 1;
          add_header X-Permitted-Cross-Domain-Policies none;
          proxy_hide_header X-Powered-By;
          server_tokens off;
          more_clear_headers Server;
        nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
        nginx.ingress.kubernetes.io/limit-rpm: "1200"
        nginx.ingress.kubernetes.io/proxy-body-size: 200M
        nginx.ingress.kubernetes.io/proxy-buffer-size: 64k
        nginx.ingress.kubernetes.io/proxy-buffers: 8 64k
      hosts:
        - host: waga-api.demo.local
          paths:
            - path: /
              pathType: ImplementationSpecific
              servicePort: http
      tls:
        - secretName: waga-api.demo.local-tls
          hosts:
            - waga-api.demo.local
