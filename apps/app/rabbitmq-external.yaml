apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: develop
spec:
  type: ClusterIP
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
      protocol: TCP
    - name: http-stats
      port: 15672
      targetPort: 15672
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: rabbitmq-external
  namespace: develop
  labels:
    kubernetes.io/service-name: rabbitmq
addressType: IPv4
ports:
  - name: amqp
    port: 5672
    protocol: TCP
  - name: http-stats
    port: 15672
    protocol: TCP
endpoints:
  - addresses:
      - 192.168.49.51
