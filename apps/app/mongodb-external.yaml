apiVersion: v1
kind: Service
metadata:
  name: pulse-mongodb
  namespace: develop
spec:
  ports:
    - name: mongodb
      port: 27017
      targetPort: 27017
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: pulse-mongodb-external
  namespace: develop
  labels:
    kubernetes.io/service-name: pulse-mongodb
addressType: IPv4
ports:
  - name: mongodb
    port: 27017
    protocol: TCP
endpoints:
  - addresses:
      - 192.168.49.50
