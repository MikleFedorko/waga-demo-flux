apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: develop
spec:
  type: ClusterIP
  ports:
    - name: minio-api
      port: 9000
      targetPort: 9000
      protocol: TCP
    - name: minio-console
      port: 9001
      targetPort: 9001
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: minio-external
  namespace: develop
  labels:
    kubernetes.io/service-name: minio
addressType: IPv4
ports:
  - name: minio-api
    port: 9000
    protocol: TCP
  - name: minio-console
    port: 9001
    protocol: TCP
endpoints:
  - addresses:
      - 192.168.49.52
