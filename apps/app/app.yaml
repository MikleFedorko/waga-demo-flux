---
# Source: waga/templates/app/minio/pv.yaml
apiVersion: v1
kind: PersistentVolume
metadata:
  name: minio
spec:
  storageClassName: "local-path"
  capacity:
    storage: 30Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    type: "DirectoryOrCreate"
    path: /mnt/itfLocalProvisionerData/minio
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - waga-demo

---
# Source: waga/templates/app/minio/pv.yaml
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio
  namespace: develop
  labels:
    app.kubernetes.io/name: waga
    helm.sh/chart: waga-0.0.1
    app.kubernetes.io/instance: app
    app.kubernetes.io/managed-by: Helm
spec:
  accessModes:
    - ReadWriteOnce
  volumeName: "minio"
  resources:
    requests:
      storage: 30Gi
  storageClassName: "local-path"
  volumeMode: Filesystem

---
# Source: waga/templates/helmrepo/bitnami-helmrepo.yaml
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: bitnami
  namespace: develop
spec:
  interval: 10m
  url:  https://charts.bitnami.com/bitnami
